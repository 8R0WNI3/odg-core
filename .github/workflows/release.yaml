name: Release
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options:
          - candidate
          - regular

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  preprocess:
    name: Preprocess
    runs-on: ubuntu-latest
    environment: # require approval to run
      name: release
      deployment: false
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Verify release branch
        run: |
          if [[ "$GITHUB_REF_TYPE" != "branch" || ! "$GITHUB_REF_NAME" =~ ^release-[0-9]+\.[0-9]+$ ]]; then
            echo "Error: release workflow must run on a 'release-<major>.<minor>' branch, got: $GITHUB_REF_NAME"
            echo "Hint: run the 'Prepare Release Candidate' workflow first to create a release branch."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          persist-credentials: false
          sparse-checkout: |
            .ocm
      - name: Verify component references are no release candidates
        if: ${{ inputs.mode == 'regular' }}
        run: |
          candidates=$(yq '.componentReferences[].version | select(test("-rc\\."))' .ocm/component-constructor.yaml)
          if [[ -n "$candidates" ]]; then
            echo "Error: the following componentReference versions are release candidates:"
            echo "$candidates"
            echo "All componentReferences in .ocm/base-component.yaml must be full releases before releasing."
            exit 1
          fi
      - name: Determine version
        id: version
        run: |
          set -euo pipefail

          # extract <major>.<minor> from branch name "release-<major>.<minor>"
          major_minor_version="${GITHUB_REF_NAME#release-}"

          # find the highest existing tag for this minor version
          last_tag=$(git tag --list "${major_minor_version}.*" | sort -V | tail -1)

          if [[ -z "${last_tag}" ]]; then
            # no prior tag: first release of this minor version
            last_patch=-1
            last_rc=-1
          elif [[ "${last_tag}" =~ ^[0-9]+\.[0-9]+\.([0-9]+)-rc\.([0-9]+)$ ]]; then
            last_patch="${BASH_REMATCH[1]}"
            last_rc="${BASH_REMATCH[2]}"
          elif [[ "${last_tag}" =~ ^[0-9]+\.[0-9]+\.([0-9]+)$ ]]; then
            last_patch="${BASH_REMATCH[1]}"
            last_rc=-1
          else
            echo "Error: could not parse last tag '${last_tag}'"
            exit 1
          fi

          if [[ "${{ inputs.mode }}" == "candidate" ]]; then
            if [[ "${last_rc}" == -1 ]]; then
              next_patch=$(( last_patch + 1 ))
            else
              next_patch="${last_patch}"
            fi
            next_rc=$(( last_rc + 1 ))
            version="${major_minor_version}.${next_patch}-rc.${next_rc}"
          else
            # regular release: promote current patch (drop rc suffix) or bump patch
            if [[ "${last_rc}" == -1 ]]; then
              # no rc in progress: bump patch directly
              version="${major_minor_version}.$(( last_patch + 1 ))"
            else
              # promote the rc to a full release
              version="${major_minor_version}.${last_patch}"
            fi
          fi

          echo "Determined version: ${version} (last tag: ${last_tag:-none})"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build-and-publish-artifacts:
    name: Build and publish OCI artifacts
    needs:
      - preprocess
    uses: ./.github/workflows/build-and-publish-artifacts.yaml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.preprocess.outputs.version }}

  publish-component:
    name: Publish OCM component
    needs:
      - build-and-publish-artifacts
      - preprocess
    uses: ./.github/workflows/publish-component.yaml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.preprocess.outputs.version }}
      core-image-digest: ${{ needs.build-and-publish-artifacts.outputs.core-image-digest }}
      bootstrapping-chart-digest: ${{ needs.build-and-publish-artifacts.outputs.bootstrapping-chart-digest }}
      delivery-service-chart-digest: ${{ needs.build-and-publish-artifacts.outputs.delivery-service-chart-digest }}
      extensions-chart-digest: ${{ needs.build-and-publish-artifacts.outputs.extensions-chart-digest }}

  pypi:
    runs-on: ubuntu-latest
    name: Publish to PyPI
    needs:
      - build-and-publish-artifacts
    permissions:
      id-token: write
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution-packages
          path: dist/
      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1 # assumes package to be located in `dist/`

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-and-publish-artifacts
      - preprocess
    permissions:
      contents: write
    steps:
      - name: Create tag and release
        env:
          VERSION: ${{ needs.preprocess.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          prerelease_flag=""
          if [[ "${VERSION}" == *-rc.* ]]; then
            prerelease_flag="--prerelease"
          fi

          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            ${prerelease_flag}
