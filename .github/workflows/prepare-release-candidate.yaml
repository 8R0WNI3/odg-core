name: Prepare Release Candidate
on:
  workflow_dispatch:
    inputs:
      commit-sha:
        type: string
        required: false
        description: |
          Optional commit SHA to create the release branch from (defaults to HEAD)

permissions: {}

jobs:
  prepare-release-candidate:
    name: Prepare release candidate
    runs-on: ubuntu-latest
    environment:
      name: release-branch
      deployment: false
    permissions:
      contents: write
    steps:
      - name: Generate app token
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - name: Create release branch
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit-sha }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail

          last_tag=$(git tag --list "*.*.*" \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1 || true)

          if [[ -z "${last_tag}" ]]; then
            version="0.1"
          else
            major=$(echo "${last_tag}" | cut -d. -f1)
            minor=$(echo "${last_tag}" | cut -d. -f2)
            version="${major}.$(( minor + 1 ))"
          fi

          target="${COMMIT_SHA:-${GITHUB_SHA}}"

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/git/refs \
            -f "ref=refs/heads/release-${version}" \
            -f "sha=${target}"

          echo "Created branch release-${version} at ${target}"
